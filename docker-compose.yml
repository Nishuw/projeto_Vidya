version: '3.8'

services:
  # API FastAPI
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sales.db
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=vidya_sales
    depends_on:
      - mongodb
    volumes:
      - .:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=vidya_sales
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: